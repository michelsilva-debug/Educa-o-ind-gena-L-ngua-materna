name: Extract project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Nenhum arquivo ZIP encontrado."
            exit 1
          fi

          rm -rf /tmp/project
          mkdir -p /tmp/project

          unzip -q "$ZIP" -d /tmp/project

          ROOT=$(find /tmp/project -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -n "$ROOT" ]; then
            cp -R "$ROOT"/. .
          else
            cp -R /tmp/project/. .
          fi

          rm -f "$ZIP"

      - name: Commit extracted project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commit."
            exit 0
          fi

          git commit -m "chore: organizar projeto consolidado"
          git push
